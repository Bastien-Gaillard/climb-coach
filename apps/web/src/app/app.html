@if (bare()) {
<router-outlet />
} @else {
<div class="shell" [class.immersive]="immersive()">
  <aside class="side">
    <a routerLink="/" class="brand" aria-label="climb-coach, accueil">
      <span class="logo" aria-hidden="true">
        @for (i of [0, 1, 2, 3, 4, 5, 6, 7, 8]; track i) {
        <span [class.dim]="i % 2"></span>
        }
      </span>
      climb-coach
    </a>

    <nav aria-label="Navigation principale">
      <a routerLink="/generer" routerLinkActive="active" ariaCurrentWhenActive="page" class="gen">
        <app-icon name="generate" />Générer
      </a>
      <a routerLink="/planning" routerLinkActive="active" ariaCurrentWhenActive="page" class="plan">
        <app-icon name="calendar" />Planning
      </a>
      <a
        routerLink="/historique"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="hist"
      >
        <app-icon name="history" />Historique
      </a>
      <a routerLink="/seance" routerLinkActive="active" ariaCurrentWhenActive="page" class="fab">
        <span class="fab-btn"><app-icon name="plus" [size]="28" [stroke]="2.6" /></span>
        <span class="lbl-m">Séance</span><span class="lbl-d">Nouvelle séance</span>
      </a>
      <a routerLink="/salles" routerLinkActive="active" ariaCurrentWhenActive="page" class="gyms">
        <app-icon name="gym" />Salles
      </a>
      <a
        routerLink="/convertisseur"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="conv"
      >
        <app-icon name="convert" />Convertir
      </a>
    </nav>

    <div class="account side-account">
      <app-icon name="user" [size]="20" />
      <span class="who">{{ auth.username() }}</span>
      <button type="button" class="ghost switch" (click)="auth.logout()">Changer</button>
    </div>
  </aside>

  <main>
    <div class="account top-account">
      <app-icon name="user" [size]="16" />
      <span class="who">{{ auth.username() }}</span>
      <button type="button" class="ghost switch" (click)="auth.logout()">Changer de compte</button>
    </div>
    <app-ai-banner />
    <router-outlet />
  </main>
</div>
}
