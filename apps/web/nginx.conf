server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interne de Docker, relu toutes les 10 s : si le conteneur api est recréé
  # (nouvelle IP), nginx le retrouve sans avoir besoin d'être redémarré.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # L'API est servie sur le même domaine : pas de CORS à gérer
  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }

  # Routes Angular
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
